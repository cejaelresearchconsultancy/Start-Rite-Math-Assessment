                            )
                          }
                        />

                        <span className="font-semibold">
                          Show explanations after submission
                        </span>
                      </label>
                    </div>

                    <div className="bg-white border rounded-2xl p-6 space-y-5">
                      <h3 className="font-bold text-lg">
                        Appearance
                      </h3>

                      <ColorInput
                        label="Primary Colour"
                        value={
                          config.primaryColor
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              primaryColor:
                                value
                            })
                          )
                        }
                      />

                      <ColorInput
                        label="Secondary Colour"
                        value={
                          config.secondaryColor
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              secondaryColor:
                                value
                            })
                          )
                        }
                      />

                      <ColorInput
                        label="Background Colour"
                        value={
                          config.backgroundColor
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              backgroundColor:
                                value
                            })
                          )
                        }
                      />

                      <ColorInput
                        label="Text Colour"
                        value={
                          config.textColor
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              textColor:
                                value
                            })
                          )
                        }
                      />

                      <div>
                        <label className="block text-sm font-semibold mb-2">
                          School Logo
                        </label>

                        {config.logoUrl && (
                          <div className="border rounded-xl p-4 mb-4 bg-slate-50">
                            <img
                              src={
                                config.logoUrl
                              }
                              alt="School logo"
                              className="max-h-24 max-w-[280px] object-contain"
                            />
                          </div>
                        )}

                        <input
                          ref={
                            fileInputRef
                          }
                          type="file"
                          accept="image/*"
                          onChange={
                            uploadLogo
                          }
                          className="w-full border rounded-lg p-2"
                        />

                        {logoUploading && (
                          <div className="flex items-center gap-2 text-sm mt-2">
                            <Spinner />
                            Uploading logo...
                          </div>
                        )}
                      </div>

                      <div className="border rounded-xl p-5">
                        <p className="text-sm font-semibold mb-3">
                          Live Preview
                        </p>

                        <div
                          className="rounded-xl p-5 text-white"
                          style={{
                            background:
                              config.primaryColor
                          }}
                        >
                          {config.logoUrl && (
                            <img
                              src={
                                config.logoUrl
                              }
                              className="h-10 max-w-[180px] object-contain bg-white rounded p-1 mb-3"
                            />
                          )}

                          <p className="text-xs uppercase opacity-80">
                            {
                              config.schoolName
                            }
                          </p>

                          <h4 className="font-bold text-xl">
                            {
                              config.title
                            }
                          </h4>

                          <p className="text-sm opacity-90">
                            {
                              config.subtitle
                            }
                          </p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* =================================================
                   EXPORT
                   ================================================= */}

              {tab ===
                "export" && (
                <div>
                  <div className="mb-6">
                    <h2 className="text-2xl font-bold">
                      Export Data
                    </h2>

                    <p className="text-slate-500 mt-1">
                      Download assessment data as CSV files.
                    </p>
                  </div>

                  <div className="grid md:grid-cols-3 gap-5">
                    <ExportCard
                      title="Student Responses"
                      description="Complete student responses, scores and per-question marks."
                      button="Export Responses"
                      onClick={
                        exportResponses
                      }
                    />

                    <ExportCard
                      title="Question Analysis"
                      description="Question-level success rates and answer-option distribution."
                      button="Export Question Analysis"
                      onClick={
                        exportQuestionAnalysis
                      }
                    />

                    <ExportCard
                      title="Class Analysis"
                      description="Submission counts and average percentages by class."
                      button="Export Class Analysis"
                      onClick={
                        exportClassAnalysis
                      }
                    />
                  </div>

                  <div className="bg-white border rounded-2xl p-6 mt-6">
                    <h3 className="font-bold text-lg mb-4">
                      Current Dataset
                    </h3>

                    <div className="grid sm:grid-cols-3 gap-4">
                      <InfoRow
                        label="Submissions"
                        value={
                          submissions.length
                        }
                      />

                      <InfoRow
                        label="Questions"
                        value={
                          questions.length
                        }
                      />

                      <InfoRow
                        label="Classes"
                        value={
                          CLASS_OPTIONS.length
                        }
                      />
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    /* =========================================================
       SMALL ADMIN COMPONENTS
       ========================================================= */

    function StatCard({
      title,
      value
    }) {
      return (
        <div className="bg-white border rounded-2xl shadow-sm p-6">
          <p className="text-sm text-slate-500">
            {title}
          </p>

          <p className="text-3xl font-bold text-[#123f73] mt-2">
            {value}
          </p>
        </div>
      );
    }

    function InfoRow({
      label,
      value
    }) {
      return (
        <div className="flex justify-between gap-4 py-2 border-b last:border-b-0">
          <span className="text-slate-500">
            {label}
          </span>

          <strong className="text-right">
            {value}
          </strong>
        </div>
      );
    }

    function AdminInput({
      label,
      value,
      onChange
    }) {
      return (
        <div>
          <label className="block text-sm font-semibold mb-2">
            {label}
          </label>

          <input
            value={
              value || ""
            }
            onChange={e =>
              onChange(
                e.target.value
              )
            }
            className="w-full border rounded-lg px-4 py-3"
          />
        </div>
      );
    }

    function AdminTextarea({
      label,
      value,
      onChange
    }) {
      return (
        <div>
          <label className="block text-sm font-semibold mb-2">
            {label}
          </label>

          <textarea
            value={
              value || ""
            }
            onChange={e =>
              onChange(
                e.target.value
              )
            }
            className="w-full border rounded-lg px-4 py-3 min-h-[100px]"
          />
        </div>
      );
    }

    function ColorInput({
      label,
      value,
      onChange
    }) {
      return (
        <div>
          <label className="block text-sm font-semibold mb-2">
            {label}
          </label>

          <div className="flex gap-3">
            <input
              type="color"
              value={
                value || "#000000"
              }
              onChange={e =>
                onChange(
                  e.target.value
                )
              }
              className="h-12 w-16 border rounded cursor-pointer"
            />

            <input
              value={
                value || ""
              }
              onChange={e =>
                onChange(
                  e.target.value
                )
              }
              className="flex-1 border rounded-lg px-4 py-3"
            />
          </div>
        </div>
      );
    }

    function ExportCard({
      title,
      description,
      button,
      onClick
    }) {
      return (
        <div className="bg-white border rounded-2xl shadow-sm p-6">
          <h3 className="font-bold text-lg">
            {title}
          </h3>

          <p className="text-sm text-slate-500 mt-2 min-h-[50px]">
            {description}
          </p>

          <button
            onClick={onClick}
            className="mt-5 w-full bg-[#123f73] text-white rounded-lg py-3 font-semibold"
          >
            {button}
          </button>
        </div>
      );
    }

    /* =========================================================
       ROOT APP
       ========================================================= */

    function App() {
      const [
        config,
        setConfig
      ] = useState(
        cloneConfig()
      );

      const [
        questions,
        setQuestions
      ] = useState(
        cloneQuestions()
      );

      const [
        loading,
        setLoading
      ] = useState(true);

      const [
        page,
        setPage
      ] = useState(
        "student"
      );

      const [
        adminUser,
        setAdminUser
      ] = useState(null);

      const [
        submissions,
        setSubmissions
      ] = useState([]);

      const [
        firebaseError,
        setFirebaseError
      ] = useState("");

      /* =====================================================
         LOAD PUBLIC SETTINGS
         ===================================================== */

      async function reloadPublicData() {
        try {
          const data =
            await loadPublicSettings();

          setConfig(
            data.config
          );

          setQuestions(
            data.questions
          );
        } catch (error) {
          console.error(
            error
          );
        }
      }

      /* =====================================================
         LOAD ADMIN DATA
         ===================================================== */

      async function loadAdminData() {
        if (
          !firebaseReady ||
          !db
        ) {
          return;
        }

        try {
          const settingsSnapshot =
            await db
              .collection(
                "assessmentSettings"
              )
              .doc(
                ASSESSMENT_ID
              )
              .get();

          if (
            settingsSnapshot.exists
          ) {
            const data =
              settingsSnapshot.data() ||
              {};

            if (
              data.config
            ) {
              setConfig(
                {
                  ...cloneConfig(),
                  ...data.config
                }
              );
            }

            if (
              Array.isArray(
                data.questions
              ) &&
              data.questions.length
            ) {
              setQuestions(
                data.questions
              );
            }
          }

          const submissionsSnapshot =
            await db
              .collection(
                "submissions"
              )
              .where(
                "assessmentId",
                "==",
                ASSESSMENT_ID
              )
              .get();

          const list =
            submissionsSnapshot.docs
              .map(doc => ({
                id: doc.id,
                ...doc.data()
              }))
              .sort(
                (a, b) => {
                  const dateA =
                    safeDate(
                      a.submittedAt
                    );

                  const dateB =
                    safeDate(
                      b.submittedAt
                    );

                  return (
                    (dateB
                      ? dateB.getTime()
                      : 0) -
                    (dateA
                      ? dateA.getTime()
                      : 0)
                  );
                }
              );

          setSubmissions(
            list
          );
        } catch (error) {
          console.error(
            "Admin data error:",
            error
          );

          setFirebaseError(
            error.message
          );
        }
      }

      /* =====================================================
         INITIAL LOAD
         ===================================================== */

      useEffect(() => {
        async function initialise() {
          setLoading(
            true
          );

          await reloadPublicData();

          setLoading(
            false
          );
        }

        initialise();
      }, []);

      /* =====================================================
         AUTH STATE
         ===================================================== */

      useEffect(() => {
        if (
          !firebaseReady ||
          !auth
        ) {
          return;
        }

        const unsubscribe =
          auth.onAuthStateChanged(
            async user => {
              if (
                user &&
                isAllowedAdmin(
                  user.email
                )
              ) {
                setAdminUser(
                  user
                );

                setPage(
                  "admin"
                );

                await loadAdminData();
              } else {
                if (user) {
                  await auth.signOut();
                }

                setAdminUser(
                  null
                );
              }
            }
          );

        return () =>
          unsubscribe();
      }, []);

      /* =====================================================
         LOGOUT
         ===================================================== */

      async function logout() {
        if (
          auth &&
          auth.currentUser
        ) {
          await auth.signOut();
        }

        setAdminUser(
          null
        );

        setPage(
          "student"
        );

        await reloadPublicData();
      }

      /* =====================================================
         LOADING
         ===================================================== */

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-100">
            <div className="text-center">
              <div className="h-10 w-10 rounded-full border-4 border-slate-300 border-t-[#123f73] animate-spin mx-auto" />

              <p className="mt-4 font-semibold text-slate-700">
                Loading assessment...
              </p>
            </div>
          </div>
        );
      }

      /* =====================================================
         ADMIN
         ===================================================== */

      if (
        page === "admin" &&
        adminUser &&
        isAllowedAdmin(
          adminUser.email
        )
      ) {
        return (
          <AdminDashboard
            user={
              adminUser
            }
            config={
              config
            }
            setConfig={
              setConfig
            }
            questions={
              questions
            }
            setQuestions={
              setQuestions
            }
            submissions={
              submissions
            }
            reloadData={
              loadAdminData
            }
            onLogout={
              logout
            }
          />
        );
      }

      /* =====================================================
         LOGIN
         ===================================================== */

      if (
        page === "login"
      ) {
        return (
          <StaffLogin
            onBack={() =>
              setPage(
                "student"
              )
            }
            onAuthenticated={user => {
              setAdminUser(
                user
              );

              setPage(
                "admin"
              );

              loadAdminData();
            }}
          />
        );
      }

      /* =====================================================
         STUDENT
         ===================================================== */

      return (
        <StudentAssessment
          config={
            config
          }
          questions={
            questions
          }
          onStaffLogin={() =>
            setPage(
              "login"
            )
          }
        />
      );
    }

    /* =========================================================
       RENDER
       ========================================================= */

    ReactDOM.createRoot(
      document.getElementById(
        "root"
      )
    ).render(
      <App />
    );
  </script>
</body>
</html>

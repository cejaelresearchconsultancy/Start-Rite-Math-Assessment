    function safeDate(value) {
      if (!value) return null;

      try {
        if (
          value &&
          typeof value.toDate === "function"
        ) {
          return value.toDate();
        }

        const d = new Date(value);

        return isNaN(d.getTime())
          ? null
          : d;
      } catch {
        return null;
      }
    }

    function formatDate(value) {
      const date = safeDate(value);

      if (!date) return "—";

      return date.toLocaleString(
        "en-NG",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );
    }

    function escapeCSV(value) {
      const text =
        value === null ||
        value === undefined
          ? ""
          : String(value);

      return `"${text.replace(
        /"/g,
        '""'
      )}"`;
    }

    function downloadCSV(
      filename,
      rows
    ) {
      if (
        !rows ||
        !rows.length
      ) {
        alert(
          "There is no data to export."
        );
        return;
      }

      const csv = rows
        .map(row =>
          row
            .map(escapeCSV)
            .join(",")
        )
        .join("\n");

      const blob =
        new Blob(
          ["\ufeff" + csv],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const link =
        document.createElement(
          "a"
        );

      link.href = url;
      link.download =
        filename;

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      URL.revokeObjectURL(
        url
      );
    }

    function renderMath(text) {
      if (
        !text ||
        typeof text !== "string"
      ) {
        return "";
      }

      try {
        let html = text;

        html = html.replace(
          /\\\[(.*?)\\\]/gs,
          (_, formula) =>
            katex.renderToString(
              formula,
              {
                throwOnError: false,
                displayMode: true
              }
            )
        );

        html = html.replace(
          /\$(.*?)\$/g,
          (_, formula) =>
            katex.renderToString(
              formula,
              {
                throwOnError: false,
                displayMode: false
              }
            )
        );

        return html;
      } catch {
        return text;
      }
    }

    async function createStudentLockId(
      surname,
      firstName,
      className
    ) {
      const raw =
        normalizeStudentKey(
          surname,
          firstName,
          className
        );

      if (
        window.crypto &&
        window.crypto.subtle &&
        window.TextEncoder
      ) {
        const data =
          new TextEncoder().encode(
            raw
          );

        const hashBuffer =
          await crypto.subtle.digest(
            "SHA-256",
            data
          );

        return Array.from(
          new Uint8Array(
            hashBuffer
          )
        )
          .map(b =>
            b
              .toString(16)
              .padStart(2, "0")
          )
          .join("");
      }

      return btoa(
        unescape(
          encodeURIComponent(
            raw
          )
        )
      )
        .replace(
          /[^a-zA-Z0-9]/g,
          ""
        )
        .substring(
          0,
          100
        );
    }

    async function loadPublicSettings() {
      if (!firebaseReady || !db) {
        return {
          config: cloneConfig(),
          questions:
            cloneQuestions()
        };
      }

      try {
        const snapshot =
          await db
            .collection(
              "assessmentSettings"
            )
            .doc(
              ASSESSMENT_ID
            )
            .get();

        if (!snapshot.exists) {
          return {
            config: cloneConfig(),
            questions:
              cloneQuestions()
          };
        }

        const data =
          snapshot.data() || {};

        return {
          config: {
            ...cloneConfig(),
            ...(data.config || {})
          },

          questions:
            Array.isArray(
              data.questions
            ) &&
            data.questions.length
              ? data.questions
              : cloneQuestions()
        };
      } catch (error) {
        console.error(
          "Settings loading error:",
          error
        );

        return {
          config: cloneConfig(),
          questions:
            cloneQuestions()
        };
      }
    }

      async function submitAssessment() {
        setError("");

        if (
          !firebaseReady ||
          !db
        ) {
          setError(
            "The assessment system is not connected to Firebase. Please contact the teacher."
          );
          return;
        }

        if (
          !surname.trim()
        ) {
          setError(
            "Please enter your surname."
          );
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }

        if (
          !firstName.trim()
        ) {
          setError(
            "Please enter your first name."
          );
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
          return;
        }

        if (!className) {
          setError(
            "Please select your class."
          );
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
          return;
        }

        if (
          answeredCount !==
          questions.length
        ) {
          setError(
            `You have answered ${answeredCount} of ${questions.length} questions. Please answer every question before submitting.`
          );

          const firstUnanswered =
            questions.findIndex(
              (_, index) =>
                answers[index] ===
                undefined
            );

          if (
            firstUnanswered >=
            0
          ) {
            const element =
              document.getElementById(
                `question-${firstUnanswered}`
              );

            if (element) {
              element.scrollIntoView({
                behavior:
                  "smooth",
                block:
                  "center"
              });
            }
          }

          return;
        }

        if (
          !window.confirm(
            "Are you sure you want to submit your assessment? You cannot submit it again after submission."
          )
        ) {
          return;
        }

        setSubmitting(true);

        try {
          const lockId =
            await createStudentLockId(
              surname,
              firstName,
              className
            );

          const lockRef =
            db
              .collection(
                "submissionLocks"
              )
              .doc(
                `${ASSESSMENT_ID}_${lockId}`
              );

          const submissionRef =
            db
              .collection(
                "submissions"
              )
              .doc(
                generateRandomId()
              );

          let score = 0;

          const details =
            questions.map(
              (
                question,
                index
              ) => {
                const selected =
                  answers[
                    index
                  ];

                const correct =
                  selected ===
                  question.correct;

                if (correct) {
                  score++;
                }

                return {
                  questionNumber:
                    index + 1,

                  topic:
                    question.topic ||
                    "",

                  question:
                    question.question ||
                    "",

                  options:
                    question.options ||
                    [],

                  selectedAnswer:
                    selected,

                  selectedOption:
                    question
                      .options[
                      selected
                    ] || "",

                  correctAnswer:
                    question.correct,

                  correctOption:
                    question
                      .options[
                      question.correct
                    ] || "",

                  isCorrect:
                    correct,

                  explanation:
                    question.explanation ||
                    ""
                };
              }
            );

          const percentage =
            Math.round(
              (score /
                questions.length) *
                10000
            ) / 100;

          const submissionData =
            {
              assessmentId:
                ASSESSMENT_ID,

              assessmentTitle:
                config.subtitle,

              surname:
                surname.trim(),

              firstName:
                firstName.trim(),

              className,

              score,

              total:
                questions.length,

              percentage,

              details,

              submittedAt:
                firebase.firestore
                  .FieldValue
                  .serverTimestamp(),

              clientSubmittedAt:
                new Date().toISOString()
            };

          await db.runTransaction(
            async transaction => {
              const lockSnapshot =
                await transaction.get(
                  lockRef
                );

              if (
                lockSnapshot.exists
              ) {
                throw new Error(
                  "DUPLICATE_SUBMISSION"
                );
              }

              transaction.set(
                lockRef,
                {
                  assessmentId:
                    ASSESSMENT_ID,

                  createdAt:
                    firebase.firestore
                      .FieldValue
                      .serverTimestamp(),

                  submissionId:
                    submissionRef.id
                }
              );

              transaction.set(
                submissionRef,
                submissionData
              );
            }
          );

          setResult({
            score,
            total:
              questions.length,
            percentage,
            details
          });

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        } catch (submitError) {
          console.error(
            "Submission error:",
            submitError
          );

          if (
            submitError.message ===
            "DUPLICATE_SUBMISSION"
          ) {
            setError(
              "A submission already exists for this student name and class for this assessment. Only one submission is allowed."
            );
          } else {
            setError(
              "We could not submit your assessment. Please check your internet connection and try again."
            );
          }
        } finally {
          setSubmitting(false);
        }
      }

      if (result) {
        return (
          <div
            className="min-h-screen py-10 px-4"
            style={{
              background:
                config.backgroundColor
            }}
          >
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
                <div

                      config.primaryColor

                  <p className="text-sm uppercase tracking-wider opacity-90">

                      config.schoolName

                  <h1 className="text-3xl font-bold mt-2">

                  <div className="rounded-xl bg-slate-50 p-5 mb-8">

                  {config.showExplanations && (

                                </div>

                                <div className="flex-1">

          <main className="max-w-5xl mx-auto px-4 py-8">

    /* =========================================================
       STAFF LOGIN
       ========================================================= */

    function StaffLogin({
      onBack,
      onAuthenticated
    }) {
      const [
        email,
        setEmail
      ] = useState("");

      const [
        password,
        setPassword
      ] = useState("");

      const [
        loading,
        setLoading
      ] = useState(false);

      const [
        error,
        setError
      ] = useState("");

      async function login(
        event
      ) {
        event.preventDefault();

        setError("");

        const normalizedEmail =
          email
            .trim()
            .toLowerCase();

        if (
          !isAllowedAdmin(
            normalizedEmail
          )
        ) {
          setError(
            "This email address is not authorised to access the staff dashboard."
          );
          return;
        }

        if (!password) {
          setError(
            "Please enter your password."
          );
          return;
        }

        if (
          !firebaseReady ||
          !auth
        ) {
          setError(
            "Firebase Authentication is not configured correctly."
          );
          return;
        }

        setLoading(true);

        try {
          const credential =
            await auth.signInWithEmailAndPassword(
              normalizedEmail,
              password
            );

          if (
            !credential.user ||
            !isAllowedAdmin(
              credential.user
                .email
            )
          ) {
            await auth.signOut();

            throw new Error(
              "UNAUTHORISED"
            );
          }

          onAuthenticated(
            credential.user
          );
        } catch (loginError) {
          console.error(
            loginError
          );

          if (
            loginError.message ===
            "UNAUTHORISED"
          ) {
            setError(
              "This account is not authorised to access the staff dashboard."
            );
          } else if (
            loginError.code ===
            "auth/invalid-credential"
          ) {
            setError(
              "Invalid email address or password."
            );
          } else if (
            loginError.code ===
            "auth/user-not-found"
          ) {
            setError(
              "No Firebase Authentication account exists for this email address."
            );
          } else if (
            loginError.code ===
            "auth/wrong-password"
          ) {
            setError(
              "The password is incorrect."
            );
          } else {
            setError(
              loginError.message ||
                "Unable to sign in."
            );
          }
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-10">
          <div className="w-full max-w-md">
            <div className="bg-white rounded-2xl shadow-xl border overflow-hidden">
              <div className="bg-[#123f73] text-white p-7">
                <p className="text-sm uppercase tracking-wider opacity-80">
                  START-RITE SCHOOLS
                </p>

                <h1 className="text-2xl font-bold mt-2">
                  Staff Dashboard
                </h1>

                <p className="text-blue-100 mt-1">
                  Mathematics Assessment Portal
                </p>
              </div>

              <form
                onSubmit={
                  login
                }
                className="p-7"
              >
                {error && (
                  <div className="mb-5">
                    <AlertBox type="error">
                      {error}
                    </AlertBox>
                  </div>
                )}

                <div className="mb-4">
                  <label className="block text-sm font-semibold mb-2">
                    Staff Email
                  </label>

                  <input
                    type="email"
                    value={
                      email
                    }
                    onChange={e =>
                      setEmail(
                        e.target.value
                      )
                    }
                    className="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter authorised staff email"
                    autoComplete="username"
                  />
                </div>

                <div className="mb-6">
                  <label className="block text-sm font-semibold mb-2">
                    Password
                  </label>

                  <input
                    type="password"
                    value={
                      password
                    }
                    onChange={e =>
                      setPassword(
                        e.target.value
                      )
                    }
                    className="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter password"
                    autoComplete="current-password"
                  />
                </div>

                <button
                  type="submit"
                  disabled={
                    loading
                  }
                  className="w-full bg-[#123f73] text-white rounded-lg py-3 font-bold disabled:opacity-50"
                >
                  {
                    loading
                      ? "Signing in..."
                      : "Sign In"
                  }
                </button>

                <button
                  type="button"
                  onClick={
                    onBack
                  }
                  className="w-full mt-3 border border-slate-300 rounded-lg py-3 font-semibold"
                >
                  Back to Assessment
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================
       ADMIN DASHBOARD
       ========================================================= */

    function AdminDashboard({
      user,
      config,
      setConfig,
      questions,
      setQuestions,
      submissions,
      reloadData,
      onLogout
    }) {
      const [
        tab,
        setTab
      ] = useState(
        "dashboard"
      );

      const [
        saving,
        setSaving
      ] = useState(false);

      const [
        message,
        setMessage
      ] = useState("");

      const [
        search,
        setSearch
      ] = useState("");

      const [
        editingQuestion,
        setEditingQuestion
      ] = useState(null);

      const [
        selectedClass,
        setSelectedClass
      ] = useState("All");

      const [
        selectedQuestion,
        setSelectedQuestion
      ] = useState(0);

      const [
        logoUploading,
        setLogoUploading
      ] = useState(false);

      const fileInputRef =
        useRef(null);

      /* =====================================================
         SAVE SETTINGS
         ===================================================== */

      async function saveSettings() {
        if (
          !firebaseReady ||
          !db ||
          !user ||
          !isAllowedAdmin(
            user.email
          )
        ) {
          alert(
            "You are not authorised to perform this action."
          );
          return;
        }

        setSaving(true);
        setMessage("");

        try {
          await db
            .collection(
              "assessmentSettings"
            )
            .doc(
              ASSESSMENT_ID
            )
            .set(
              {
                config,
                questions
              },
              {
                merge: true
              }
            );

          setMessage(
            "Settings saved successfully."
          );

          await reloadData();
        } catch (error) {
          console.error(
            error
          );

          setMessage(
            "Could not save settings: " +
              error.message
          );
        } finally {
          setSaving(false);
        }
      }

      /* =====================================================
         SAVE QUESTIONS
         ===================================================== */

      async function saveQuestions() {
        if (
          !firebaseReady ||
          !db ||
          !user ||
          !isAllowedAdmin(
            user.email
          )
        ) {
          alert(
            "You are not authorised to perform this action."
          );
          return;
        }

        setSaving(true);
        setMessage("");

        try {
          await db
            .collection(
              "assessmentSettings"
            )
            .doc(
              ASSESSMENT_ID
            )
            .set(
              {
                config,
                questions
              },
              {
                merge: true
              }
            );

          setMessage(
            "Question bank saved successfully."
          );

          await reloadData();
        } catch (error) {
          console.error(
            error
          );

          setMessage(
            "Could not save questions: " +
              error.message
          );
        } finally {
          setSaving(false);
        }
      }

      /* =====================================================
         UPLOAD LOGO
         ===================================================== */

      async function uploadLogo(
        event
      ) {
        const file =
          event.target.files?.[0];

        if (!file) return;

        if (
          !firebaseReady ||
          !storage
        ) {
          alert(
            "Firebase Storage is not configured."
          );
          return;
        }

        setLogoUploading(
          true
        );

        try {
          const extension =
            file.name
              .split(".")
              .pop();

          const storageRef =
            storage
              .ref()
              .child(
                `assessment-logos/${ASSESSMENT_ID}/logo-${Date.now()}.${extension}`
              );

          await storageRef.put(
            file
          );

          const url =
            await storageRef.getDownloadURL();

          setConfig(
            previous => ({
              ...previous,
              logoUrl: url
            })
          );

          setMessage(
            "Logo uploaded. Click Save Branding to make the change permanent."
          );
        } catch (error) {
          console.error(
            error
          );

          alert(
            "Logo upload failed: " +
              error.message
          );
        } finally {
          setLogoUploading(
            false
          );

          if (
            fileInputRef.current
          ) {
            fileInputRef.current.value =
              "";
          }
        }
      }

      /* =====================================================
         QUESTION EDITING
         ===================================================== */

      function updateQuestion(
        index,
        field,
        value
      ) {
        setQuestions(
          previous =>
            previous.map(
              (
                question,
                questionIndex
              ) =>
                questionIndex ===
                index
                  ? {
                      ...question,
                      [field]:
                        value
                    }
                  : question
            )
        );
      }

      function updateOption(
        questionIndex,
        optionIndex,
        value
      ) {
        setQuestions(
          previous =>
            previous.map(
              (
                question,
                index
              ) =>
                index ===
                questionIndex
                  ? {
                      ...question,
                      options:
                        question.options.map(
                          (
                            option,
                            i
                          ) =>
                            i ===
                            optionIndex
                              ? value
                              : option
                        )
                    }
                  : question
            )
        );
      }

      /* =====================================================
         FILTERED SUBMISSIONS
         ===================================================== */

      const filteredSubmissions =
        useMemo(() => {
          let list =
            [...submissions];

          if (
            selectedClass !==
            "All"
          ) {
            list =
              list.filter(
                item =>
                  item.className ===
                  selectedClass
              );
          }

          if (
            search.trim()
          ) {
            const q =
              search
                .trim()
                .toLowerCase();

            list =
              list.filter(
                item =>
                  `${item.surname} ${item.firstName}`
                    .toLowerCase()
                    .includes(q) ||
                  String(
                    item.className ||
                      ""
                  )
                    .toLowerCase()
                    .includes(q)
              );
          }

          return list;
        }, [
          submissions,
          selectedClass,
          search
        ]);

      /* =====================================================
         STATISTICS
         ===================================================== */

      const statistics =
        useMemo(() => {
          const total =
            submissions.length;

          const average =
            total
              ? submissions.reduce(
                  (
                    sum,
                    item
                  ) =>
                    sum +
                    Number(
                      item.percentage ||
                        0
                    ),
                  0
                ) / total
              : 0;

          const highest =
            total
              ? Math.max(
                  ...submissions.map(
                    item =>
                      Number(
                        item.percentage ||
                          0
                      )
                  )
                )
              : 0;

          const lowest =
            total
              ? Math.min(
                  ...submissions.map(
                    item =>
                      Number(
                        item.percentage ||
                          0
                      )
                  )
                )
              : 0;

          return {
            total,
            average,
            highest,
            lowest
          };
        }, [
          submissions
        ]);

      /* =====================================================
         CLASS SUMMARY
         ===================================================== */

      const classSummary =
        useMemo(() => {
          return CLASS_OPTIONS.map(
            className => {
              const list =
                submissions.filter(
                  item =>
                    item.className ===
                    className
                );

              const average =
                list.length
                  ? list.reduce(
                      (
                        sum,
                        item
                      ) =>
                        sum +
                        Number(
                          item.percentage ||
                            0
                        ),
                      0
                    ) /
                    list.length
                  : 0;

              return {
                className,
                count:
                  list.length,
                average
              };
            }
          );
        }, [
          submissions
        ]);

      /* =====================================================
         QUESTION ANALYSIS
         ===================================================== */

      const questionAnalysis =
        useMemo(() => {
          return questions.map(
            (
              question,
              questionIndex
            ) => {
              let answered = 0;
              let correct = 0;

              const distribution =
                [
                  0,
                  0,
                  0,
                  0
                ];

              submissions.forEach(
                submission => {
                  const detail =
                    submission
                      .details?.[
                      questionIndex
                    ];

                  if (!detail)
                    return;

                  if (
                    detail.selectedAnswer !==
                    undefined
                  ) {
                    answered++;

                    const selected =
                      Number(
                        detail.selectedAnswer
                      );

                    if (
                      selected >=
                        0 &&
                      selected <=
                        3
                    ) {
                      distribution[
                        selected
                      ]++;
                    }
                  }

                  if (
                    detail.isCorrect
                  ) {
                    correct++;
                  }
                }
              );

              const successRate =
                submissions.length
                  ? (
                      (correct /
                        submissions.length) *
                      100
                    ).toFixed(1)
                  : "0.0";

              return {
                question,
                questionIndex,
                answered,
                correct,
                successRate,
                distribution
              };
            }
          );
        }, [
          questions,
          submissions
        ]);

      /* =====================================================
         EXPORT RESPONSES
         ===================================================== */

      function exportResponses() {
        const headers = [
          "Surname",
          "First Name",
          "Class",
          "Score",
          "Total",
          "Percentage",
          "Submitted At"
        ];

        for (
          let i = 1;
          i <= questions.length;
          i++
        ) {
          headers.push(
            `Q${i} Answer`
          );

          headers.push(
            `Q${i} Score`
          );
        }

        const rows =
          [headers];

        filteredSubmissions.forEach(
          submission => {
            const row = [
              submission.surname,
              submission.firstName,
              submission.className,
              submission.score,
              submission.total,
              submission.percentage,
              formatDate(
                submission.submittedAt
              )
            ];

            questions.forEach(
              (
                _,
                questionIndex
              ) => {
                const detail =
                  submission
                    .details?.[
                    questionIndex
                  ];

                row.push(
                  detail
                    ? detail.selectedOption ||
                        ""
                    : ""
                );

                row.push(
                  detail &&
                    detail.isCorrect
                    ? 1
                    : 0
                );
              }
            );

            rows.push(row);
          }
        );

        downloadCSV(
          "start-rite-mathematics-responses.csv",
          rows
        );
      }

      /* =====================================================
         EXPORT QUESTION ANALYSIS
         ===================================================== */

      function exportQuestionAnalysis() {
        const rows = [
          [
            "Question",
            "Topic",
            "Correct",
            "Total Submissions",
            "Success Rate",
            "A",
            "B",
            "C",
            "D"
          ]
        ];

        questionAnalysis.forEach(
          analysis => {
            rows.push([
              analysis.questionIndex +
                1,
              analysis.question.topic,
              analysis.correct,
              submissions.length,
              analysis.successRate +
                "%",
              analysis.distribution[0],
              analysis.distribution[1],
              analysis.distribution[2],
              analysis.distribution[3]
            ]);
          }
        );

        downloadCSV(
          "start-rite-question-analysis.csv",
          rows
        );
      }

      /* =====================================================
         EXPORT CLASS ANALYSIS
         ===================================================== */

      function exportClassAnalysis() {
        const rows = [
          [
            "Class",
            "Submissions",
            "Average Percentage"
          ]
        ];

        classSummary.forEach(
          item => {
            rows.push([
              item.className,
              item.count,
              item.average.toFixed(
                2
              )
            ]);
          }
        );

        downloadCSV(
          "start-rite-class-analysis.csv",
          rows
        );
      }

      /* =====================================================
         NAVIGATION
         ===================================================== */

      const navItems = [
        [
          "dashboard",
          "Dashboard"
        ],
        [
          "responses",
          "Responses"
        ],
        [
          "questions",
          "Questions"
        ],
        [
          "analysis",
          "Analysis"
        ],
        [
          "branding",
          "Branding"
        ],
        [
          "export",
          "Export"
        ]
      ];

      /* =====================================================
         RENDER
         ===================================================== */

      return (
        <div className="min-h-screen bg-slate-100">
          <header
            className="text-white shadow"
            style={{
              background:
                config.primaryColor
            }}
          >
            <div className="px-5 md:px-8 py-4 flex items-center justify-between gap-4">
              <div>
                <p className="text-xs uppercase tracking-wider opacity-80">
                  {
                    config.schoolName
                  }
                </p>

                <h1 className="text-xl md:text-2xl font-bold">
                  Mathematics Assessment Portal
                </h1>

                <p className="text-sm text-blue-100">
                  {
                    config.subtitle
                  }
                </p>
              </div>

              <div className="flex items-center gap-3">
                <span className="hidden md:block text-sm">
                  {
                    user.email
                  }
                </span>

                <button
                  onClick={
                    onLogout
                  }
                  className="bg-white/10 border border-white/30 rounded-lg px-4 py-2 text-sm font-semibold hover:bg-white/20"
                >
                  Sign Out
                </button>
              </div>
            </div>
          </header>

          <div className="flex">
            <aside className="hidden md:block w-60 bg-white border-r min-h-[calc(100vh-73px)] sticky top-0">
              <nav className="p-3 space-y-1">
                {navItems.map(
                  item => (
                    <button
                      key={
                        item[0]
                      }
                      onClick={() =>
                        setTab(
                          item[0]
                        )
                      }
                      className={`sidebar-item w-full text-left px-4 py-3 rounded-lg ${tab === item[0] ? "active" : ""}`}
                    >
                      {
                        item[1]
                      }
                    </button>
                  )
                )}
              </nav>
            </aside>

            <main className="flex-1 p-4 md:p-8">
              <div className="md:hidden mb-5">
                <select
                  value={tab}
                  onChange={e =>
                    setTab(
                      e.target.value
                    )
                  }
                  className="w-full bg-white border rounded-lg px-4 py-3"
                >
                  {navItems.map(
                    item => (
                      <option
                        key={
                          item[0]
                        }
                        value={
                          item[0]
                        }
                      >
                        {
                          item[1]
                        }
                      </option>
                    )
                  )}
                </select>
              </div>

              {message && (
                <div className="mb-5">
                  <AlertBox type="success">
                    {message}
                  </AlertBox>
                </div>
              )}

              {/* =================================================
                   DASHBOARD
                   ================================================= */}

              {tab ===
                "dashboard" && (
                <div>
                  <div className="mb-6">
                    <h2 className="text-2xl font-bold">
                      Dashboard
                    </h2>

                    <p className="text-slate-500 mt-1">
                      Overview of the current assessment.
                    </p>
                  </div>

                  <div className="grid sm:grid-cols-2 xl:grid-cols-4 gap-5">
                    <StatCard
                      title="Total Submissions"
                      value={
                        statistics.total
                      }
                    />

                    <StatCard
                      title="Average Score"
                      value={`${statistics.average.toFixed(1)}%`}
                    />

                    <StatCard
                      title="Highest Score"
                      value={`${statistics.highest}%`}
                    />

                    <StatCard
                      title="Lowest Score"
                      value={`${statistics.lowest}%`}
                    />
                  </div>

                  <div className="grid lg:grid-cols-2 gap-6 mt-6">
                    <div className="bg-white rounded-2xl border shadow-sm p-6">
                      <h3 className="font-bold text-lg mb-5">
                        Class Summary
                      </h3>

                      <div className="space-y-4">
                        {classSummary.map(
                          item => (
                            <div
                              key={
                                item.className
                              }
                              className="border rounded-xl p-4"
                            >
                              <div className="flex justify-between">
                                <strong>
                                  {
                                    item.className
                                  }
                                </strong>

                                <span>
                                  {
                                    item.count
                                  }{" "}
                                  submissions
                                </span>
                              </div>

                              <div className="mt-3 h-2 bg-slate-200 rounded-full overflow-hidden">
                                <div
                                  className="h-full"
                                  style={{
                                    width: `${Math.min(item.average, 100)}%`,
                                    background:
                                      config.primaryColor
                                  }}
                                />
                              </div>

                              <p className="text-sm text-slate-500 mt-2">
                                Average:{" "}
                                <strong>
                                  {
                                    item.average.toFixed(
                                      1
                                    )
                                  }
                                  %
                                </strong>
                              </p>
                            </div>
                          )
                        )}
                      </div>
                    </div>

                    <div className="bg-white rounded-2xl border shadow-sm p-6">
                      <h3 className="font-bold text-lg mb-5">
                        Assessment
                      </h3>

                      <div className="space-y-4">
                        <InfoRow
                          label="School"
                          value={
                            config.schoolName
                          }
                        />

                        <InfoRow
                          label="Assessment"
                          value={
                            config.subtitle
                          }
                        />

                        <InfoRow
                          label="Questions"
                          value={
                            questions.length
                          }
                        />

                        <InfoRow
                          label="Firebase"
                          value={
                            firebaseReady
                              ? "Connected"
                              : "Not connected"
                          }
                        />

                        <InfoRow
                          label="Admin"
                          value={
                            user.email
                          }
                        />
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* =================================================
                   RESPONSES
                   ================================================= */}

              {tab ===
                "responses" && (
                <div>
                  <div className="mb-6">
                    <h2 className="text-2xl font-bold">
                      Responses
                    </h2>

                    <p className="text-slate-500 mt-1">
                      View all student submissions.
                    </p>
                  </div>

                  <div className="bg-white border rounded-2xl p-4 mb-5">
                    <div className="grid md:grid-cols-3 gap-3">
                      <input
                        value={
                          search
                        }
                        onChange={e =>
                          setSearch(
                            e.target
                              .value
                          )
                        }
                        placeholder="Search student..."
                        className="border rounded-lg px-4 py-3"
                      />

                      <select
                        value={
                          selectedClass
                        }
                        onChange={e =>
                          setSelectedClass(
                            e.target
                              .value
                          )
                        }
                        className="border rounded-lg px-4 py-3"
                      >
                        <option value="All">
                          All Classes
                        </option>

                        {CLASS_OPTIONS.map(
                          item => (
                            <option
                              key={
                                item
                              }
                              value={
                                item
                              }
                            >
                              {
                                item
                              }
                            </option>
                          )
                        )}
                      </select>

                      <button
                        onClick={
                          exportResponses
                        }
                        className="bg-[#123f73] text-white rounded-lg px-4 py-3 font-semibold"
                      >
                        Export CSV
                      </button>
                    </div>
                  </div>

                  <div className="bg-white border rounded-2xl shadow-sm overflow-hidden">
                    <div className="scroll-table">
                      <table className="w-full text-sm">
                        <thead className="bg-slate-100">
                          <tr>
                            <th className="text-left p-4">
                              #
                            </th>

                            <th className="text-left p-4">
                              Student
                            </th>

                            <th className="text-left p-4">
                              Class
                            </th>

                            <th className="text-left p-4">
                              Score
                            </th>

                            <th className="text-left p-4">
                              Percentage
                            </th>

                            <th className="text-left p-4">
                              Submitted
                            </th>
                          </tr>
                        </thead>

                        <tbody>
                          {filteredSubmissions.map(
                            (
                              item,
                              index
                            ) => (
                              <tr
                                key={
                                  item.id ||
                                  index
                                }
                                className="border-t hover:bg-slate-50"
                              >
                                <td className="p-4">
                                  {
                                    index +
                                    1
                                  }
                                </td>

                                <td className="p-4 font-semibold">
                                  {
                                    item.surname
                                  }{" "}
                                  {
                                    item.firstName
                                  }
                                </td>

                                <td className="p-4">
                                  {
                                    item.className
                                  }
                                </td>

                                <td className="p-4">
                                  {
                                    item.score
                                  }/
                                  {
                                    item.total
                                  }
                                </td>

                                <td className="p-4 font-bold">
                                  {
                                    item.percentage
                                  }%
                                </td>

                                <td className="p-4">
                                  {formatDate(
                                    item.submittedAt
                                  )}
                                </td>
                              </tr>
                            )
                          )}

                          {!filteredSubmissions.length && (
                            <tr>
                              <td
                                colSpan="6"
                                className="p-10 text-center text-slate-500"
                              >
                                No submissions found.
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* =================================================
                   QUESTIONS
                   ================================================= */}

              {tab ===
                "questions" && (
                <div>
                  <div className="flex flex-col md:flex-row justify-between gap-4 mb-6">
                    <div>
                      <h2 className="text-2xl font-bold">
                        Question Bank
                      </h2>

                      <p className="text-slate-500 mt-1">
                        Edit questions, options, answers and explanations.
                      </p>
                    </div>

                    <button
                      onClick={
                        saveQuestions
                      }
                      disabled={
                        saving
                      }
                      className="bg-[#123f73] text-white rounded-lg px-5 py-3 font-semibold disabled:opacity-50"
                    >
                      {saving
                        ? "Saving..."
                        : "Save Questions"}
                    </button>
                  </div>

                  <div className="space-y-5">
                    {questions.map(
                      (
                        question,
                        index
                      ) => (
                        <div
                          key={
                            question.id
                          }
                          className="bg-white border rounded-2xl shadow-sm overflow-hidden"
                        >
                          <button
                            onClick={() =>
                              setEditingQuestion(
                                editingQuestion ===
                                  index
                                  ? null
                                  : index
                              )
                            }
                            className="w-full p-5 text-left flex items-center justify-between gap-4"
                          >
                            <div className="flex gap-4 items-center">
                              <div
                                className="h-9 w-9 rounded-full text-white flex items-center justify-center font-bold"
                                style={{
                                  background:
                                    config.primaryColor
                                }}
                              >
                                {
                                  index +
                                  1
                                }
                              </div>

                              <div>
                                <p className="text-xs text-slate-500 uppercase">
                                  {
                                    question.topic
                                  }
                                </p>

                                <p className="font-semibold">
                                  <MathText>
                                    {
                                      question.question
                                    }
                                  </MathText>
                                </p>
                              </div>
                            </div>

                            <span>
                              {editingQuestion ===
                              index
                                ? "▲"
                                : "▼"}
                            </span>
                          </button>

                          {editingQuestion ===
                            index && (
                            <div className="border-t p-5 space-y-5">
                              <div>
                                <label className="block text-sm font-semibold mb-2">
                                  Topic
                                </label>

                                <input
                                  value={
                                    question.topic
                                  }
                                  onChange={e =>
                                    updateQuestion(
                                      index,
                                      "topic",
                                      e.target
                                        .value
                                    )
                                  }
                                  className="w-full border rounded-lg px-4 py-3"
                                />
                              </div>

                              <div>
                                <label className="block text-sm font-semibold mb-2">
                                  Question
                                </label>

                                <textarea
                                  value={
                                    question.question
                                  }
                                  onChange={e =>
                                    updateQuestion(
                                      index,
                                      "question",
                                      e.target
                                        .value
                                    )
                                  }
                                  className="admin-textarea w-full border rounded-lg px-4 py-3"
                                />

                                <p className="text-xs text-slate-500 mt-2">
                                  Use $...$ for mathematical expressions.
                                </p>
                              </div>

                              <div className="grid md:grid-cols-2 gap-4">
                                {question.options.map(
                                  (
                                    option,
                                    optionIndex
                                  ) => (
                                    <div
                                      key={
                                        optionIndex
                                      }
                                    >
                                      <label className="block text-sm font-semibold mb-2">
                                        Option{" "}
                                        {
                                          OPTION_LETTERS[
                                            optionIndex
                                          ]
                                        }
                                      </label>

                                      <input
                                        value={
                                          option
                                        }
                                        onChange={e =>
                                          updateOption(
                                            index,
                                            optionIndex,
                                            e.target
                                              .value
                                          )
                                        }
                                        className="w-full border rounded-lg px-4 py-3"
                                      />
                                    </div>
                                  )
                                )}
                              </div>

                              <div>
                                <label className="block text-sm font-semibold mb-2">
                                  Correct Answer
                                </label>

                                <select
                                  value={
                                    question.correct
                                  }
                                  onChange={e =>
                                    updateQuestion(
                                      index,
                                      "correct",
                                      Number(
                                        e.target
                                          .value
                                      )
                                    )
                                  }
                                  className="w-full border rounded-lg px-4 py-3"
                                >
                                  {OPTION_LETTERS.map(
                                    (
                                      letter,
                                      optionIndex
                                    ) => (
                                      <option
                                        key={
                                          optionIndex
                                        }
                                        value={
                                          optionIndex
                                        }
                                      >
                                        {
                                          letter
                                        }
                                      </option>
                                    )
                                  )}
                                </select>
                              </div>

                              <div>
                                <label className="block text-sm font-semibold mb-2">
                                  Explanation
                                </label>

                                <textarea
                                  value={
                                    question.explanation
                                  }
                                  onChange={e =>
                                    updateQuestion(
                                      index,
                                      "explanation",
                                      e.target
                                        .value
                                    )
                                  }
                                  className="admin-textarea w-full border rounded-lg px-4 py-3"
                                />
                              </div>

                              <div className="bg-slate-50 border rounded-xl p-4">
                                <p className="text-xs uppercase text-slate-500 mb-2">
                                  Preview
                                </p>

                                <p className="font-semibold mb-3">
                                  <MathText>
                                    {
                                      question.question
                                    }
                                  </MathText>
                                </p>

                                <div className="space-y-2">
                                  {question.options.map(
                                    (
                                      option,
                                      optionIndex
                                    ) => (
                                      <div
                                        key={
                                          optionIndex
                                        }
                                        className={`p-3 rounded-lg border ${
                                          optionIndex ===
                                          question.correct
                                            ? "bg-green-50 border-green-300"
                                            : "bg-white"
                                        }`}
                                      >
                                        <strong>
                                          {
                                            OPTION_LETTERS[
                                              optionIndex
                                            ]
                                          }.
                                        </strong>{" "}
                                        <MathText>
                                          {
                                            option
                                          }
                                        </MathText>
                                      </div>
                                    )
                                  )}
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      )
                    )}
                  </div>
                </div>
              )}

              {/* =================================================
                   ANALYSIS
                   ================================================= */}

              {tab ===
                "analysis" && (
                <div>
                  <div className="mb-6">
                    <h2 className="text-2xl font-bold">
                      Assessment Analysis
                    </h2>

                    <p className="text-slate-500 mt-1">
                      Question-level and class-level performance.
                    </p>
                  </div>

                  <div className="grid md:grid-cols-3 gap-4 mb-6">
                    <button
                      onClick={
                        exportQuestionAnalysis
                      }
                      className="bg-white border rounded-xl p-4 text-left hover:bg-slate-50"
                    >
                      <strong>
                        Export Question Analysis
                      </strong>

                      <p className="text-sm text-slate-500 mt-1">
                        Correct responses and option distribution.
                      </p>
                    </button>

                    <button
                      onClick={
                        exportClassAnalysis
                      }
                      className="bg-white border rounded-xl p-4 text-left hover:bg-slate-50"
                    >
                      <strong>
                        Export Class Analysis
                      </strong>

                      <p className="text-sm text-slate-500 mt-1">
                        Class submission counts and averages.
                      </p>
                    </button>

                    <div className="bg-white border rounded-xl p-4">
                      <strong>
                        Total Submissions
                      </strong>

                      <p className="text-3xl font-bold text-[#123f73] mt-2">
                        {
                          submissions.length
                        }
                      </p>
                    </div>
                  </div>

                  <div className="bg-white border rounded-2xl shadow-sm overflow-hidden">
                    <div className="p-5 border-b">
                      <h3 className="font-bold text-lg">
                        Question-Level Analysis
                      </h3>
                    </div>

                    <div className="scroll-table">
                      <table className="w-full text-sm">
                        <thead className="bg-slate-100">
                          <tr>
                            <th className="p-4 text-left">
                              Q
                            </th>

                            <th className="p-4 text-left">
                              Topic
                            </th>

                            <th className="p-4 text-left">
                              Correct
                            </th>

                            <th className="p-4 text-left">
                              Success
                            </th>

                            <th className="p-4 text-left">
                              A
                            </th>

                            <th className="p-4 text-left">
                              B
                            </th>

                            <th className="p-4 text-left">
                              C
                            </th>

                            <th className="p-4 text-left">
                              D
                            </th>
                          </tr>
                        </thead>

                        <tbody>
                          {questionAnalysis.map(
                            analysis => (
                              <tr
                                key={
                                  analysis.questionIndex
                                }
                                className="border-t"
                              >
                                <td className="p-4 font-bold">
                                  {
                                    analysis.questionIndex +
                                    1
                                  }
                                </td>

                                <td className="p-4">
                                  {
                                    analysis.question
                                      .topic
                                  }
                                </td>

                                <td className="p-4">
                                  {
                                    analysis.correct
                                  }/
                                  {
                                    submissions.length
                                  }
                                </td>

                                <td className="p-4 font-bold">
                                  {
                                    analysis.successRate
                                  }%
                                </td>

                                {analysis.distribution.map(
                                  (
                                    count,
                                    index
                                  ) => (
                                    <td
                                      key={
                                        index
                                      }
                                      className="p-4"
                                    >
                                      {
                                        count
                                      }
                                    </td>
                                  )
                                )}
                              </tr>
                            )
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="bg-white border rounded-2xl shadow-sm mt-6 overflow-hidden">
                    <div className="p-5 border-b">
                      <h3 className="font-bold text-lg">
                        Class-Level Analysis
                      </h3>
                    </div>

                    <div className="p-5">
                      <div className="grid md:grid-cols-3 gap-4">
                        {classSummary.map(
                          item => (
                            <div
                              key={
                                item.className
                              }
                              className="border rounded-xl p-5"
                            >
                              <p className="text-sm text-slate-500">
                                {
                                  item.className
                                }
                              </p>

                              <p className="text-3xl font-bold mt-2">
                                {
                                  item.average.toFixed(
                                    1
                                  )
                                }%
                              </p>

                              <p className="text-sm text-slate-500 mt-1">
                                {
                                  item.count
                                }{" "}
                                submissions
                              </p>
                            </div>
                          )
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* =================================================
                   BRANDING
                   ================================================= */}

              {tab ===
                "branding" && (
                <div>
                  <div className="flex justify-between items-start gap-4 mb-6">
                    <div>
                      <h2 className="text-2xl font-bold">
                        Branding & Settings
                      </h2>

                      <p className="text-slate-500 mt-1">
                        Changes are saved to Firebase.
                      </p>
                    </div>

                    <button
                      onClick={
                        saveSettings
                      }
                      disabled={
                        saving
                      }
                      className="bg-[#123f73] text-white rounded-lg px-5 py-3 font-semibold disabled:opacity-50"
                    >
                      {
                        saving
                          ? "Saving..."
                          : "Save Branding"
                      }
                    </button>
                  </div>

                  <div className="grid lg:grid-cols-2 gap-6">
                    <div className="bg-white border rounded-2xl p-6 space-y-5">
                      <h3 className="font-bold text-lg">
                        Text Settings
                      </h3>

                      <AdminInput
                        label="School Name"
                        value={
                          config.schoolName
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              schoolName:
                                value
                            })
                          )
                        }
                      />

                      <AdminInput
                        label="Platform Title"
                        value={
                          config.title
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              title:
                                value
                            })
                          )
                        }
                      />

                      <AdminInput
                        label="Assessment Title"
                        value={
                          config.subtitle
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              subtitle:
                                value
                            })
                          )
                        }
                      />

                      <AdminTextarea
                        label="Instructions"
                        value={
                          config.instructions
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              instructions:
                                value
                            })
                          )
                        }
                      />

                      <AdminInput
                        label="Submit Button Text"
                        value={
                          config.submitButtonText
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              submitButtonText:
                                value
                            })
                          )
                        }
                      />

                      <AdminInput
                        label="Result Title"
                        value={
                          config.resultTitle
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              resultTitle:
                                value
                            })
                          )
                        }
                      />

                      <AdminTextarea
                        label="Result Message"
                        value={
                          config.resultMessage
                        }
                        onChange={value =>
                          setConfig(
                            previous => ({
                              ...previous,
                              resultMessage:
                                value
                            })
                          )
                        }
                      />

                      <label className="flex items-center gap-3">
                        <input
                          type="checkbox"
                          checked={
                            config.showExplanations
                          }
                          onChange={e =>
                            setConfig(
                              previous => ({
                                ...previous,
                                showExplanations:
                                  e.target
                                    .checked
                              })
